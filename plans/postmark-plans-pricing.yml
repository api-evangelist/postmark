specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Postmark
providerId: postmark
created: '2026-05-04'
# 2026-08-13: upgraded generated -> searched. Prices, volumes, overage rates and
# per-tier feature lists below were read directly from https://postmarkapp.com/pricing
# (data-floor-price / data-floor-volume / data-floor-overages attributes and the
# rendered plan cards). Previous version was written by the 2026-05-04 bulk sweep.
method: searched
modified: '2026-08-13'
reconciled: true
tags:
  - Email
  - Transactional
description: >-
  Postmark's four published tiers, priced by monthly email volume. Every tier
  except Free is metered: the listed price is the FLOOR at 10,000 emails/month
  and rises with the volume slider, with overages billed per 1,000 extra emails
  at a rate that gets cheaper as the tier gets more expensive.
sources:
  - https://postmarkapp.com/pricing
currency: USD
billingPeriod: month
annualPlans: false
annualPlansNote: >-
  Postmark states on its own pricing FAQ that it does not currently offer annual
  plans.
volumeModel:
  floorVolume: 10000
  sliderMaxObserved: 300000
  note: >-
    The published prices are the floor at 10,000 emails/month. There is no tier
    between the 100-email Free plan and the 10,000-email paid floor — Postmark
    says so explicitly in its pricing FAQ.
overageModel:
  unit: 1000 emails
  billing: >-
    Extra emails are calculated at the end of the billing cycle and added to the
    following month's plan cost.
  rollover: false
plans:
  - id: postmark-free
    name: Free
    type: freemium
    description: Developer tier — 100 emails/month, never expires, no overages permitted.
    entries:
      - label: Emails
        name: emails
        type: quota
        metric: email
        limit: 100
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    overage:
      allowed: false
      price: '0.00'
    elements:
      - name: 100 emails/month, no expiry
      - name: REST API and SMTP
      - name: Sandbox Mode
      - name: Unlimited emails/day
      - name: Suitable for testing an integration and evaluating deliverability
    notAvailable:
      - Two-factor authentication
      - Dedicated IPs
      - Inbound email processing
  - id: postmark-basic
    name: Basic
    type: paid
    description: For solo developers and smaller teams. $15.00/month at 10,000 emails.
    entries:
      - label: Monthly
        name: monthly
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '15.00'
        userMultiplied: false
      - label: Emails
        name: emails
        type: quota
        metric: email
        limit: 10000
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    overage:
      allowed: true
      price: '1.80'
      per: 1000 emails
    limits:
      dataRetentionDays: 45
      dataRetentionConfigurable: false
      customSendingDomains: 5
      dailyEmailLimit: unlimited
    elements:
      - name: Industry-leading deliverability rates & speed
      - name: 45-day data retention
      - name: 5 custom sending domains
      - name: Unlimited emails/day
      - name: Detailed analytics and insights
    notAvailable:
      - Inbound email processing
      - Dedicated IPs
  - id: postmark-pro
    name: Pro
    type: paid
    mostPopular: true
    description: For start-ups and small businesses. $16.50/month at 10,000 emails.
    entries:
      - label: Monthly
        name: monthly
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '16.50'
        userMultiplied: false
      - label: Emails
        name: emails
        type: quota
        metric: email
        limit: 10000
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    overage:
      allowed: true
      price: '1.30'
      per: 1000 emails
    limits:
      dataRetentionDays: 45
      dataRetentionConfigurable: true
      dataRetentionMaxDays: 365
      customSendingDomains: 10
      dailyEmailLimit: unlimited
    elements:
      - name: Industry-leading deliverability rates & speed
      - name: Customizable data retention up to 365 days (45-day default)
      - name: 10 custom sending domains
      - name: Unlimited emails/day
      - name: Detailed analytics and insights
      - name: Inbound email processing
      - name: Eligible for the Dedicated IPs and Custom retention add-ons
  - id: postmark-platform
    name: Platform
    type: paid
    description: For agencies and larger teams. $18.00/month at 10,000 emails.
    entries:
      - label: Monthly
        name: monthly
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '18.00'
        userMultiplied: false
      - label: Emails
        name: emails
        type: quota
        metric: email
        limit: 10000
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    overage:
      allowed: true
      price: '1.20'
      per: 1000 emails
    limits:
      dataRetentionDays: 45
      dataRetentionConfigurable: true
      dataRetentionMaxDays: 365
      customSendingDomains: unlimited
      dailyEmailLimit: unlimited
      messageStreams: unlimited
      servers: unlimited
      users: unlimited
    elements:
      - name: Industry-leading deliverability rates & speed
      - name: Customizable data retention up to 365 days (45-day default)
      - name: Unlimited custom sending domains
      - name: Unlimited emails/day
      - name: Detailed analytics and insights
      - name: Inbound email processing
      - name: Unlimited users, servers and message streams
addOns:
  - id: dedicated-ips
    name: Dedicated IPs
    startingPrice: '50.00'
    per: IP per month
    availability: Pro plans or higher; customers sending 300,000+ emails/month
    docs: https://postmarkapp.com/dedicated-ips
  - id: custom-retention
    name: Custom activity retention
    startingPrice: '5.00'
    per: month
    availability: Pro plans or higher
    note: >-
      Configures how long Postmark stores activity data and message content
      (7–365 days). Statistics are always kept indefinitely.
  - id: dmarc-monitoring
    name: DMARC monitoring (DMARC Digests)
    startingPrice: '14.00'
    per: domain per month
    availability: all plans
enterprise:
  contactOnly: true
  form: https://postmarkapp.com/pricing
  salesUrl: https://postmarkapp.com/talk-to-sales
  volumeBands:
    - Less than 1.5 million/month
    - Between 1.5 – 10 million/month
    - More than 10 million/month
  note: >-
    Volumes above the published slider are quoted by the sales team ("Hey Big
    Sender!" custom pricing form on the pricing page).
paymentMethods:
  accepted: [Visa, MasterCard, American Express, Diners, JCB]
  notAccepted: [PayPal, Purchase Orders]
credits:
  bootstrapped: >-
    $75 account credit for launched, revenue-generating companies that have
    taken no outside investment; granted on request through support.
plan_count: 4
