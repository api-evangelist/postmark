currency_findings:
  - >-
    Two of the eight language SDKs have not shipped a release in over two years:
    postmark-rails (2022-06-29) and Postmark-Strong for .NET (2017-04-19). The
    official CLI's last npm publish is 2024-02-02.
  - >-
    The Bulk API shipped 2026-03-05 and the Python SDK 2026-04-30, so any
    consumer on postmark-rails or postmark-approved-wordpress-plugin is running
    a client older than a meaningful part of the current API surface.
