spec_coverage:
  declared_in_openapi:
    - 200
    - 422
    - 500
  missing_from_openapi:
    - 401
    - 404
    - 413
    - 415
    - 429
    - 503
  note: >-
    The 47 specs in openapi/ declare only 200, 422 and 500 across all 167
    operations. Six documented HTTP statuses — including 401 and 429, the two an
    agent most needs to branch on — appear nowhere in the machine-readable
    contract. overlays/ carries the repair.

