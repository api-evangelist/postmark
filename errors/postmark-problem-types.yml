method: searched
source: https://postmarkapp.com/developer/api/overview#api-error-codes
docs: https://postmarkapp.com/developer/api/overview#api-error-codes
description: >-
  Postmark's error surface has two layers: a small set of HTTP status codes, and
  a large numeric ErrorCode catalog carried inside a 422 JSON body. It is NOT
  RFC 9457 — there is no application/problem+json media type, no `type` URI, no
  `title`/`detail` members. The envelope is a bare JSON object with `ErrorCode`
  and `Message`. Titles and remediation below are Postmark's own published
  wording; the HTTP-status layer was cross-checked against the 422 and 500
  responses declared in openapi/.
provider: Postmark
providerId: postmark
format: vendor-json
rfc9457: false
media_type: application/json

envelope:
  shape: '{"ErrorCode": <int>, "Message": "<string>"}'
  discriminator: ErrorCode
  http_status_for_validation_errors: 422
  multi_error_form: >-
    ErrorCode 11 signals multiple errors; the response then carries an `Errors`
    array with per-item detail.
  note: >-
    The numeric ErrorCode namespace deliberately collides with HTTP status
    numbers (there is an ErrorCode 401, 403, 405, 406, 413, 500, 503 that mean
    something entirely different from the same-numbered HTTP status). An agent
    must read ErrorCode from the BODY and never infer it from the status line.

http_statuses:
  - status: 200
    title: Success
    meaning: Everything went smooth.
  - status: 401
    title: Unauthorized
    meaning: Missing or incorrect API token in header.
    remediation: Send X-Postmark-Server-Token or X-Postmark-Account-Token as the endpoint requires.
  - status: 404
    title: Entity doesn't exist
    meaning: Request for a resource/entity that does not exist.
    remediation: Verify the endpoint and the ID being requested.
  - status: 413
    title: Payload Too Large
    meaning: Exceeded 10 MB for the Email API or 50 MB total for the Batch Email API.
    remediation: Reduce message or attachment size; split the batch.
  - status: 415
    title: Unsupported Media Type
    meaning: The request is missing expected request headers.
    remediation: Set Accept and Content-Type to application/json.
  - status: 422
    title: Unprocessable Entity
    meaning: Malformed JSON or incorrect fields; body carries ErrorCode + Message.
    remediation: Read ErrorCode from the response body and branch on it.
  - status: 429
    title: Rate Limit Exceeded
    meaning: Request rate exceeds acceptable use of the API.
    remediation: Back off and reduce request rate. See rate-limits/postmark-rate-limits.yml.
  - status: 500
    title: Internal Server Error
    meaning: Postmark-side processing failure; the message is usually lost.
    remediation: Retry; Postmark is notified automatically.
  - status: 503
    title: Service Unavailable
    meaning: Planned service outage.
    remediation: Check https://status.postmarkapp.com and retry after the window.

error_codes:
  - code: 10
    title: Bad or missing API token
    remediation: Send the API token the endpoint's reference page specifies.
  - code: 11
    title: 'Multiple errors occurred'
    remediation: Inspect the Errors property on the response for per-item detail.
  - code: 12
    title: Resource not found
  - code: 13
    title: Invalid pagination key
  - code: 100
    title: Maintenance
    remediation: The API is offline for maintenance; retry after the window.
  - code: 300
    title: Invalid email request
    remediation: Validation failed for the email request JSON.
  - code: 400
    title: Sender Signature not found
    remediation: Add or use a From address that has a sender signature.
  - code: 401
    title: Sender signature not confirmed
    remediation: Resend the confirmation email from the Sender Signatures page.
  - code: 402
    title: Invalid JSON
    remediation: Run the payload through a JSON validator.
  - code: 403
    title: Invalid request field(s) - {FIELD_NAME}
    remediation: The named field is invalid; check the endpoint's required body parameters.
  - code: 405
    title: Not allowed to send
    remediation: Account has run out of credits; purchase more.
  - code: 406
    title: Inactive recipient
    remediation: >-
      Recipient generated a hard bounce or spam complaint. Only hard-bounce
      recipients can be reactivated, from the server's Activity page.
  - code: 409
    title: JSON required
    remediation: Set Accept and Content-Type to application/json.
  - code: 410
    title: Too many batch messages
    remediation: Batch requests are capped at 500 messages.
  - code: 411
    title: Forbidden attachment type
    remediation: See Postmark's forbidden file types list.
  - code: 412
    title: Account is Pending
    remediation: >-
      While pending approval, recipients must share the domain in the From
      address.
  - code: 413
    title: Account May Not Send
    remediation: The account is not approved for sending.
