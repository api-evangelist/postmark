openapi: 3.2.0
info:
  title: Postmark Message Identifier API
  description: 'Postmark helps deliver and track application email. In a nutshell, the

    service replaces SMTP (or Sendmail) with a far more reliable, scalable and

    care-free environment. In addition, you can track statistics such as

    number of emails sent or processed, opens, bounces and spam complaints.'
  version: 1.0.0
servers:
- url: http://{{baseurl}}
tags:
- name: Message Identifier
paths:
  /messages/outbound/clicks/{messageid}:
    get:
      tags:
      - Message Identifier
      summary: Postmark Retrieve Message Clicks
      parameters:
      - name: count
        in: query
        schema:
          type: string
        description: Number of bounces to return per request. Max 500.
        example: <integer>
      - name: offset
        in: query
        schema:
          type: string
        description: Number of bounces to skip.
        example: <integer>
      - name: messageid
        in: path
        schema:
          type: string
        required: true
        description: The ID of the message which should bypass inbound rules.
        example: <string>
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getMessagesOutboundClicksByMessageid
      x-operation-id-source: derived
  /messages/outbound/opens/{messageid}:
    get:
      tags:
      - Message Identifier
      summary: Postmark Retrieve Message Opens
      parameters:
      - name: count
        in: query
        schema:
          type: string
        description: Number of bounces to return per request. Max 500.
        example: <integer>
      - name: offset
        in: query
        schema:
          type: string
        description: Number of bounces to skip.
        example: <integer>
      - name: messageid
        in: path
        schema:
          type: string
        required: true
        description: The ID of the message which should bypass inbound rules.
        example: <string>
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getMessagesOutboundOpensByMessageid
      x-operation-id-source: derived
