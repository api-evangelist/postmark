openapi: 3.2.0
info:
  title: Postmark Batch API
  description: 'Postmark helps deliver and track application email. In a nutshell, the

    service replaces SMTP (or Sendmail) with a far more reliable, scalable and

    care-free environment. In addition, you can track statistics such as

    number of emails sent or processed, opens, bounces and spam complaints.'
  version: 1.0.0
servers:
- url: http://{{baseurl}}
tags:
- name: Batch
paths:
  /email/batch:
    post:
      tags:
      - Batch
      summary: Postmark Send a batch of emails
      requestBody:
        content: {}
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: postEmailBatch
      x-operation-id-source: derived
  /email/batchWithTemplates:
    post:
      tags:
      - Batch
      summary: Postmark Send a batch of email using templates
      requestBody:
        content: {}
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: postEmailBatchWithTemplates
      x-operation-id-source: derived
