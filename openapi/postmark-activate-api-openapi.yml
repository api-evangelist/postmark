openapi: 3.2.0
info:
  title: Postmark Activate API
  description: 'Postmark helps deliver and track application email. In a nutshell, the

    service replaces SMTP (or Sendmail) with a far more reliable, scalable and

    care-free environment. In addition, you can track statistics such as

    number of emails sent or processed, opens, bounces and spam complaints.'
  version: 1.0.0
servers:
- url: http://{{baseurl}}
tags:
- name: Activate
paths:
  /bounces/{bounceid}/activate:
    put:
      tags:
      - Activate
      summary: Postmark Activate a bounce
      requestBody:
        content: {}
      parameters:
      - name: bounceid
        in: path
        schema:
          type: string
        required: true
        description: The ID of the bounce to retrieve.
        example: <integer>
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: putBouncesByBounceidActivate
      x-operation-id-source: derived
