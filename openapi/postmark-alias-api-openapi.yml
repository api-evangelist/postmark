openapi: 3.2.0
info:
  title: Postmark Alias API
  description: 'Postmark helps deliver and track application email. In a nutshell, the

    service replaces SMTP (or Sendmail) with a far more reliable, scalable and

    care-free environment. In addition, you can track statistics such as

    number of emails sent or processed, opens, bounces and spam complaints.'
  version: 1.0.0
servers:
- url: http://{{baseurl}}
tags:
- name: Alias
paths:
  /templates/{templateIdOrAlias}:
    delete:
      tags:
      - Alias
      summary: Postmark Delete a Template
      parameters:
      - name: templateIdOrAlias
        in: path
        schema:
          type: string
        required: true
        description: The 'TemplateID' or 'Alias' value for the Template you wish to delete.
        example: <string>
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: deleteTemplatesByTemplateIdOrAlias
      x-operation-id-source: derived
