openapi: 3.2.0
info:
  title: Postmark Bounceid API
  description: 'Postmark helps deliver and track application email. In a nutshell, the

    service replaces SMTP (or Sendmail) with a far more reliable, scalable and

    care-free environment. In addition, you can track statistics such as

    number of emails sent or processed, opens, bounces and spam complaints.'
  version: 1.0.0
servers:
- url: http://{{baseurl}}
tags:
- name: Bounceid
paths:
  /bounces/{bounceid}:
    get:
      tags:
      - Bounceid
      summary: Postmark Get a single bounce
      parameters:
      - name: bounceid
        in: path
        schema:
          type: string
        required: true
        description: The ID of the bounce to retrieve.
        example: <integer>
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getBouncesByBounceid
      x-operation-id-source: derived
  /bounces/{bounceid}/dump:
    get:
      tags:
      - Bounceid
      summary: Postmark Get bounce dump
      parameters:
      - name: bounceid
        in: path
        schema:
          type: string
        required: true
        description: The ID of the bounce to retrieve.
        example: <integer>
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getBouncesByBounceidDump
      x-operation-id-source: derived
