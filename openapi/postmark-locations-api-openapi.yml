openapi: 3.2.0
info:
  title: Postmark Locations API
  description: 'Postmark helps deliver and track application email. In a nutshell, the

    service replaces SMTP (or Sendmail) with a far more reliable, scalable and

    care-free environment. In addition, you can track statistics such as

    number of emails sent or processed, opens, bounces and spam complaints.'
  version: 1.0.0
servers:
- url: http://{{baseurl}}
tags:
- name: Locations
paths:
  /stats/outbound/clicks/location:
    get:
      tags:
      - Locations
      summary: Postmark Get clicks by body location
      parameters:
      - name: tag
        in: query
        schema:
          type: string
        description: Filter by tag
        example: <string>
      - name: fromdate
        in: query
        schema:
          type: string
        description: Filter messages starting from the date specified. e.g. `2014-02-01`
        example: <string>
      - name: todate
        in: query
        schema:
          type: string
        description: Filter messages up to the date specified. e.g. `2014-02-01`
        example: <string>
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getStatsOutboundClicksLocation
      x-operation-id-source: derived
