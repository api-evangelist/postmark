openapi: 3.2.0
info:
  title: Postmark Bounces API
  description: 'Postmark helps deliver and track application email. In a nutshell, the

    service replaces SMTP (or Sendmail) with a far more reliable, scalable and

    care-free environment. In addition, you can track statistics such as

    number of emails sent or processed, opens, bounces and spam complaints.'
  version: 1.0.0
servers:
- url: http://{{baseurl}}
tags:
- name: Bounces
paths:
  /bounces:
    get:
      tags:
      - Bounces
      summary: Postmark Get bounces
      parameters:
      - name: count
        in: query
        schema:
          type: string
        description: Number of bounces to return per request. Max 500.
        example: <integer>
      - name: offset
        in: query
        schema:
          type: string
        description: Number of bounces to skip.
        example: <integer>
      - name: type
        in: query
        schema:
          type: string
        description: Filter by type of bounce
        example: <string>
      - name: inactive
        in: query
        schema:
          type: string
        description: Filter by emails that were deactivated by Postmark due to the bounce. Set to true or false. If this isn't specified it will return both active and inactive.
        example: <boolean>
      - name: emailFilter
        in: query
        schema:
          type: string
        description: Filter by email address
        example: <string>
      - name: messageID
        in: query
        schema:
          type: string
        description: Filter by messageID
        example: <string>
      - name: tag
        in: query
        schema:
          type: string
        description: Filter by tag
        example: <string>
      - name: todate
        in: query
        schema:
          type: string
        description: Filter messages up to the date specified. e.g. `2014-02-01`
        example: <string>
      - name: fromdate
        in: query
        schema:
          type: string
        description: Filter messages starting from the date specified. e.g. `2014-02-01`
        example: <string>
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getBounces
      x-operation-id-source: derived
  /bounces/tags:
    get:
      tags:
      - Bounces
      summary: Postmark Get bounced tags
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getBouncesTags
      x-operation-id-source: derived
