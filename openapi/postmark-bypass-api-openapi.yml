openapi: 3.2.0
info:
  title: Postmark Bypass API
  description: 'Postmark helps deliver and track application email. In a nutshell, the

    service replaces SMTP (or Sendmail) with a far more reliable, scalable and

    care-free environment. In addition, you can track statistics such as

    number of emails sent or processed, opens, bounces and spam complaints.'
  version: 1.0.0
servers:
- url: http://{{baseurl}}
tags:
- name: Bypass
paths:
  /messages/inbound/{messageid}/bypass:
    put:
      tags:
      - Bypass
      summary: Postmark Bypass rules for a blocked inbound message
      requestBody:
        content: {}
      parameters:
      - name: messageid
        in: path
        schema:
          type: string
        required: true
        description: The ID of the message which should bypass inbound rules.
        example: <string>
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: putMessagesInboundByMessageidBypass
      x-operation-id-source: derived
