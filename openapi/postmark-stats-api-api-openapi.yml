        in: header
      - name: tag
        in: query
        description: Filter by tag
        type: string
      - name: fromdate
        in: query
        type: string
        description: Filter stats starting from the date specified. e.g. `2014-01-01`
        format: date
      - name: todate
        in: query
        description: Filter stats up to the date specified. e.g. `2014-02-01`
        type: string
        format: date
      responses:
        200:
          description: OK
          schema:
            properties:
              SpamComplaint:
                type: integer
              Days:
                type: array
                items:
                  properties:
                    Date:
                      type: string
                    SpamComplaint:
                      type: integer
        422:
          $ref: '#/responses/422'
        500:
          $ref: '#/responses/500'
  /stats/outbound/tracked:
    get:
      operationId: getTrackedEmailCounts
      tags:
