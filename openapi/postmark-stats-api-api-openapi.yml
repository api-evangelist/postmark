openapi: 3.0.1
info:
  title: Postmark Account Activate Stats API API
  description: 'Postmark makes sending and receiving email incredibly easy. The Account-level API allows users to

    configure all Servers, Domains, and Sender Signatures associated

    with an Account.

    '
  version: 0.9.0
servers:
- url: //api.postmarkapp.com/
tags:
- name: Stats API
paths:
  /stats/outbound:
    get:
      operationId: getOutboundOverviewStatistics
      tags:
      - Stats API
      summary: Postmark Get outbound overview
      parameters:
      - name: X-Postmark-Server-Token
        required: true
        description: The token associated with the Server on which this request will operate.
        type: string
        in: header
      - name: tag
        in: query
        description: Filter by tag
        type: string
      - name: fromdate
        in: query
        description: Filter stats starting from the date specified. e.g. `2014-01-01`
        type: string
        format: date
      - name: todate
        in: query
        description: Filter stats up to the date specified. e.g. `2014-02-01`
        type: string
        format: date
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/OutboundOverviewStatsResponse'
        422:
          $ref: '#/responses/422'
        500:
          $ref: '#/responses/500'
  /stats/outbound/sends:
    get:
      operationId: getSentCounts
      tags:
      - Stats API
      summary: Postmark Get sent counts
      parameters:
      - name: X-Postmark-Server-Token
        required: true
        description: The token associated with the Server on which this request will operate.
        type: string
        in: header
      - name: tag
        description: Filter by tag
        in: query
        type: string
      - name: fromdate
        description: Filter stats starting from the date specified. e.g. `2014-01-01`
        in: query
        type: string
        format: date
      - name: todate
        description: Filter stats up to the date specified. e.g. `2014-02-01`
        in: query
        type: string
        format: date
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/SentCountsResponse'
        422:
          $ref: '#/responses/422'
        500:
          $ref: '#/responses/500'
  /stats/outbound/bounces:
    get:
      operationId: getBounceCounts
      tags:
      - Stats API
      summary: Postmark Get bounce counts
      parameters:
      - name: X-Postmark-Server-Token
        required: true
        description: The token associated with the Server on which this request will operate.
        type: string
        in: header
      - name: tag
        description: Filter by tag
        in: query
        type: string
      - name: fromdate
        in: query
        description: Filter stats starting from the date specified. e.g. `2014-01-01`
        type: string
        format: date
      - name: todate
        in: query
        description: Filter stats up to the date specified. e.g. `2014-02-01`
        type: string
        format: date
      responses:
        200:
          description: OK
          schema:
            properties:
              HardBounce:
                type: integer
              SMTPApiError:
                type: integer
              SoftBounce:
                type: integer
              Transient:
                type: integer
              Days:
                type: array
                items:
                  properties:
                    Date:
                      type: string
                    HardBounce:
                      type: integer
                    SoftBounce:
                      type: integer
                    SMTPApiError:
                      type: integer
                    Transient:
                      type: integer
        422:
          $ref: '#/responses/422'
        500:
          $ref: '#/responses/500'
  /stats/outbound/spam:
