      responses:
        200:
          description: OK
          schema:
            properties:
              Desktop:
                type: integer
              WebMail:
                type: integer
              Mobile:
                type: integer
              Unknown:
                type: integer
              Days:
                type: array
                items:
                  $ref: '#/definitions/DynamicResponse'
        422:
          $ref: '#/responses/422'
        500:
          $ref: '#/responses/500'
  /stats/outbound/clicks:
    get:
      operationId: getOutboundClickCounts
      tags:
