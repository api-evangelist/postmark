        type: string
        format: date
      responses:
        200:
          description: OK
          schema:
            properties:
              Opens:
                type: integer
              Unique:
                type: integer
              Days:
                type: array
                items:
                  properties:
                    Date:
                      type: string
                    Opens:
                      type: integer
                    Unique:
                      type: integer
        422:
          $ref: '#/responses/422'
        500:
