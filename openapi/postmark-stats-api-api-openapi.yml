      summary: Postmark Get tracked email counts
      parameters:
      - name: X-Postmark-Server-Token
        required: true
        description: The token associated with the Server on which this request will operate.
        type: string
        in: header
      - name: tag
        in: query
        description: Filter by tag
        type: string
      - name: fromdate
        in: query
        type: string
        description: Filter stats starting from the date specified. e.g. `2014-01-01`
        format: date
      - name: todate
        in: query
        description: Filter stats starting from the date specified. e.g. `2014-01-01`
        type: string
        format: date
      responses:
        200:
          description: OK
          schema:
            properties:
              Tracked:
                type: integer
              Days:
                type: array
                items:
                  properties:
                    Date:
                      type: string
                    Tracked:
                      type: integer
        422:
          $ref: '#/responses/422'
        500:
          $ref: '#/responses/500'
