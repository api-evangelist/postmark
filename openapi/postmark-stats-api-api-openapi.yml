definitions:
  OutboundOverviewStatsResponse:
    description: ''
    properties:
      Sent:
        type: integer
      Bounced:
        type: integer
      SMTPAPIErrors:
        type: integer
      BounceRate:
        type: integer
      SpamComplaints:
        type: integer
      SpamComplaintsRate:
        type: integer
      Opens:
        type: integer
      UniqueOpens:
        type: integer
      Tracked:
        type: integer
      WithOpenTracking:
        type: integer
      WithLinkTracking:
        type: integer
      TotalClicks:
        type: integer
      UniqueLinksClicked:
        type: integer
      TotalTrackedLinksSent:
        type: integer
      WithClientRecorded:
        type: integer
      WithPlatformRecorded:
        type: integer
  DynamicResponse:
    description: The properties of this object will vary based request parameters.
  SentCountsResponse:
    description: The result of a get sent counts operation.
    properties:
      Sent:
        type: integer
      Days:
        type: array
        items:
          properties:
            Date:
              type: string
            Sent:
              type: integer
