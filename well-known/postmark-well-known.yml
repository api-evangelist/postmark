hits: 0
findings:
  - >-
    Zero /.well-known/ documents on any Postmark host. There is no OAuth or
    OIDC surface to advertise (the API authenticates with static server and
    account tokens), so the openid-configuration and oauth-authorization-server
    404s are expected and not a gap.
  - >-
    security.txt is a genuine gap: Postmark publishes a security page at
    https://postmarkapp.com/security but exposes no machine-readable contact or
    disclosure policy at /.well-known/security.txt on either its own domain or
    ActiveCampaign's.
  - >-
    Both 404 bodies are real 404s with the correct status code — postmarkapp.com
    returns its branded "Oops, page not found" page and api.postmarkapp.com
    returns an ASP.NET "The resource cannot be found." page. Neither is a soft
    200, so there is no false-credit risk here.
