findings:
  - >-
    The MCP server is materially AHEAD of the captured OpenAPI on two whole
    resources: suppressions and webhook management. Six of 24 tools have no REST
    operation in this repo, which means an agent reading only the OpenAPI cannot
    recover their input schemas.
  - >-
    Inbound email — a marquee Postmark feature with its own SDK skill — has zero
    MCP coverage. So does everything requiring an account token (domains, sender
    signatures, multi-server management), which is consistent: the MCP server
    only ever holds a server token.
  - >-
    92 of 167 captured operations carry no operationId, which is what forces
    three crosswalk rows to fall back to METHOD + PATH.
