description: >-
  Binds each of the 24 tools in Postmark's official MCP server to the REST
  operation(s) that back it, so an agent can recover a tool's real input schema
  from the OpenAPI operation. Postmark's MCP server is local-stdio and its live
  tools/list requires a POSTMARK_SERVER_TOKEN, so tools were mapped from the
  vendor README's documented payloads by name and semantics rather than from a
  live introspection; confidence is recorded per row accordingly.
