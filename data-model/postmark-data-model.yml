description: >-
  Entity-relationship graph for the Postmark API, derived from the path
  hierarchy, the $ref links and the id-reference fields present in the specs in
  openapi/ and the extracted schemas in json-schema/. Postmark's model is
  strongly hierarchical: an Account owns Servers, a Server owns everything
  operational, and almost every resource is reachable only through the token
  that scopes it.
provider: Postmark
providerId: postmark

id_conventions:
  style: >-
    Mixed. Postmark uses integer surrogate ids for administrative resources
    (ServerID, DomainID, SignatureID, BounceID, TriggerID, WebhookID) and a
    UUID for the one identifier that crosses system boundaries.
  cross_boundary_identifier:
    field: MessageID
    format: UUID
    note: >-
      The single most important identifier in the model. Returned by every send,
      echoed on every webhook event, and the lookup key for message details,
      dump, opens and clicks. It is the join between the synchronous API and the
      asynchronous event stream.
  alias_identifier:
    field: TemplateAlias
    applies_to: Template
    note: >-
      Templates are addressable by either numeric TemplateId or a
      human-assigned Alias; the path parameter is literally
      {templateIdOrAlias}. Postmark's own docs recommend the alias for
      production sends.
  stream_identifier:
    field: MessageStream
    format: >-
      Lowercase letters, digits, '-' and '_'; must start with a letter; max 30
      characters; must not start with the reserved 'pm-' prefix (ErrorCode 1227,
      1233).

entities:
  - name: Account
    scope: account-token
    description: Billing and identity root. Not directly addressable as a resource.
  - name: Server
    scope: account-token (management) / server-token (operation)
    key: ServerID
    schemas: [ExtendedServerInfo, CreateServerPayload, EditServerPayload, ServerListingResponse]
    description: >-
      The isolation boundary. Each server has its own API token, its own
      statistics, its own tracking settings and its own DeliveryType
      (Live | Sandbox).
  - name: MessageStream
    scope: server-token
    key: ID
    description: >-
      Transactional, Broadcast or Inbound lane inside a Server. Max 10 per
      server; exactly one inbound stream per server.
  - name: Message
    scope: server-token
    key: MessageID
    description: An individual outbound or inbound email.
  - name: Template
    scope: server-token
    key: TemplateId | Alias
    description: >-
      Reusable Handlebars-style content. Max 100 per server. A Template may bind
      to a Layout template.
  - name: Layout
    scope: server-token
    description: >-
      A Template subtype used as a wrapper; must contain exactly one content
      placeholder and cannot be deleted while templates depend on it
      (ErrorCode 1130, 1131).
  - name: Bounce
    scope: server-token
    key: BounceID
    description: A delivery failure record, with an optional raw SMTP dump.
  - name: Suppression
    scope: server-token
    key: EmailAddress
    description: >-
      Per-stream suppressed recipient. Documented in the API reference but not
      present in the captured OpenAPI.
  - name: Webhook
    scope: server-token
    key: WebhookID
    description: >-
      Per-stream event subscription. Documented in the API reference but not
      present in the captured OpenAPI.
  - name: InboundRule
    scope: server-token
    key: TriggerID
    description: Blocklist rule for inbound processing, by address or domain.
  - name: Domain
    scope: account-token
    key: ID
    schemas: [DomainInformation, DomainExtendedInformation, DomainCreationModel, DomainEditingModel, DomainListingResults, DomainSPFResult, DKIMRotationResponse]
    description: Sending domain with DKIM, SPF and Return-Path verification state.
  - name: SenderSignature
    scope: account-token
    key: ID
    schemas: [SenderSignatureInformation, SenderSignatureExtendedInformation, SenderSignatureCreationModel, SenderSignatureEditingModel, SenderListingResults]
    description: A single verified From address, confirmed by email.
  - name: DataRemovalRequest
    scope: account-token
    description: GDPR-style erasure request. Documented since 2023-12-08.

