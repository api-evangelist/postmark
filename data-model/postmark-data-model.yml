event_projection:
  note: >-
    The webhook event types in asyncapi/postmark-webhooks-asyncapi.yml are the
    asynchronous projection of this model. Every event carries RecordType as its
    discriminator plus MessageID, MessageStream, Tag and Metadata — which is
    what lets a consumer rejoin an event to the Message and the caller's own
    domain object.

coverage_caveat: >-
  Only 19 component schemas exist across all 47 captured specs, and they cover
  Domains, Sender Signatures, Servers and Template push. Messages, Templates,
  Bounces, Stats, Suppressions and Webhooks are described in the specs by path
  and parameters but carry no named response schema, so those entities above are
  derived from path structure, path/query parameters and the published error
  catalog rather than from typed schemas. Suppressions and Webhooks are absent
  from the captured OpenAPI entirely and are recorded from the API reference.

