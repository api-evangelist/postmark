  - 'Free: 100 emails/month'
  - 'Basic: $15/mo for 10K emails'
  - 'Pro: $16.50/mo for 10K emails with templates and webhooks'
  - 'Platform: $18/mo for 10K emails with multiple servers and dedicated IPs'
